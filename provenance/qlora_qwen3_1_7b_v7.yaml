# QLoRA SFT v7 — Qwen3-1.7B English-only STEM tutoring (AGH track)
# Changes vs v6: 2 epochs, LoRA r=32/α=64, cleaned mix without GSM8K #### markup
model_name_or_path: Qwen/Qwen3-1.7B
output_dir: runs/qwen3_1_7b_qlora_v7

data_path: ../data/train/sft_mix_v7.jsonl

seed: 42
max_seq_length: 2048
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
bf16: true
gradient_checkpointing: true

load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

report_to: none
